<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overlander 4 Touch Controller</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
        }

        /* Top Header Readout */
        .header-bar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: #111111;
            border: 2px solid #333333;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .title {
            font-size: 16px;
            font-weight: 900;
            color: #00e5ff;
        }

        .readout {
            font-family: monospace;
            font-size: 22px;
            font-weight: 900;
            color: #f8d800;
        }

        /* Large Range Slider Track */
        .slider-box {
            height: 54px;
            background: #111111;
            border: 2px solid #333333;
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 40px;
            border-radius: 6px;
            background: #222222;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 48px;
            height: 48px;
            border-radius: 6px;
            background: #f8d800;
            cursor: pointer;
        }

        /* Massive Giant Touch Buttons Grid */
        .giant-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex-grow: 1;
        }

        .btn-giant {
            background: #1a1a1a;
            border: 3px solid #444444;
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            line-height: 1.2;
        }

        .btn-giant:active {
            background: #00e5ff;
            color: #000000;
            border-color: #00e5ff;
        }

        .btn-orange {
            border-color: #ff9900;
            color: #ff9900;
            background: #221500;
        }

        .btn-orange:active {
            background: #ff9900;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- Simple Header Readout -->
    <div class="header-bar">
        <div class="title">↔️ LESLIDE CARRIAGE (MOTOR 8)</div>
        <div id="sliderValDisplay" class="readout">2503 ticks</div>
    </div>

    <!-- Full-Width Coarse Slider -->
    <div class="slider-box">
        <input type="range" id="sliderRangeInput" min="3" max="4800" value="2503" step="10" 
               oninput="onSliderMove(this.value)" onchange="sendSliderMove(this.value)">
    </div>

    <!-- 4 MASSIVE 75px+ TALL TOUCH BUTTONS -->
    <div class="giant-grid">
        <button class="btn-giant" onclick="nudgeSlider(-50)">◀ NUDGE LEFT<br>(-50 TICKS)</button>
        <button class="btn-giant" onclick="nudgeSlider(50)">NUDGE RIGHT ▶<br>(+50 TICKS)</button>

        <button class="btn-giant btn-orange" onclick="syncGantryLeft()">🛑 SYNC LEFT<br>HARD STOP (3)</button>
        <button class="btn-giant btn-orange" onclick="syncGantryRight()">🛑 SYNC RIGHT<br>HARD STOP (4800)</button>
    </div>

    <script>
        function onSliderMove(val) {
            document.getElementById('sliderValDisplay').innerText = val + ' ticks';
        }

        function sendSliderMove(val) {
            document.getElementById('sliderValDisplay').innerText = val + ' ticks';
            fetch('/api/slider', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ value: parseInt(val) })
            });
        }

        function nudgeSlider(delta) {
            const input = document.getElementById('sliderRangeInput');
            let newVal = parseInt(input.value) + delta;
            newVal = Math.max(3, Math.min(4800, newVal));
            input.value = newVal;
            sendSliderMove(newVal);
        }

        function syncGantryLeft() {
            document.getElementById('sliderRangeInput').value = 3;
            document.getElementById('sliderValDisplay').innerText = '3 ticks (LEFT SYNCED)';
            fetch('/api/sync_position', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pos: 3 })
            });
        }

        function syncGantryRight() {
            document.getElementById('sliderRangeInput').value = 4800;
            document.getElementById('sliderValDisplay').innerText = '4800 ticks (RIGHT SYNCED)';
            fetch('/api/sync_position', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pos: 4800 })
            });
        }
    </script>
</body>
</html>
